   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="5" y="14.062988" transform="rotate(-0 5 14.062988)">Table 1. Concepts and symbols used in the replay</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="5" y="42.405146" transform="rotate(-0 5 42.405146)">Concept and symbol</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="132.559055" y="43.349209" transform="rotate(-0 132.559055 43.349209)">Definition and measurement</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="347.992126" y="43.349209" transform="rotate(-0 347.992126 43.349209)">Decision informed</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 67.447256)">Document budget K;</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 79.799189)">task coverage C0 and C</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 67.505146)">K is list length; C0 is the baseline's</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 79.854854)">task-document count; C is the proposed or</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 92.979404)">realized count</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 67.505146)">Identify the task positions added or</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 79.799189)">displaced under a finite budget</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 118.747256)">Baseline U and coverage</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 131.099189)">match B(C)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 118.805146)">U follows frozen scores; B(C) selects C task</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 131.041299)">documents by those scores</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 118.747256)">Attribute the change reproduced by</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 131.985361)">task allocation</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 157.005146)">Unfamiliarity and</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 168.415986)">exposure</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 157.891318)">A core document contains a subclass</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 169.299189)">combination absent from preceding core</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 181.535342)">history; exposure counts such selected</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 194.773447)">documents</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 157.005146)">Record unfamiliar documentary</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 169.241299)">inputs, without measuring cognition</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 182.479404)">or distinct new combinations</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 222.346982)">Unfamiliar minimum m</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 233.699189)">and list N(C,m)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 221.460811)">Require at least m unfamiliar core</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 233.699189)">documents at C, preserving B(C)'s noncore</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 246.937295)">identifiers</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 222.291318)">Assess selection within the same</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 234.585361)">task allocation</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 272.705146)">Shortfall d and a binding</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(5 284.996963)">requirement</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 272.705146)">d=max{0,m−n_B(C)}, where n_B(C) counts</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 284.999189)">unfamiliar core documents in B(C); binding</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 298.191279)">means d&gt;0</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 272.705146)">Identify whether a feasible rule</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 284.941299)">actually exchanges documents</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="5" y="324.891318" transform="rotate(-0 5 324.891318)">Task-linked documents</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 324.005146)">Selected documents cited by an external</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 336.241299)">task-core grant in the observation window;</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 348.591006)">means are per list and totals are selection</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 361.697002)">events</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 324.060811)">Compare recorded task links</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 336.241299)">gained and lost, rather than</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 348.591006)">inventions or adoption</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="5" y="389.346982" transform="rotate(-0 5 389.346982)">General reach</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 388.405146)">Selected documents cited by at least two</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 400.641299)">external organizations in the observation</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 413.879404)">window</text>
   </g>
   <g id="text_25">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 389.291318)">Retain broader archival reach as a</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 400.641299)">separate objective</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9.5px; font-family: 'Arial'; text-anchor: start; fill: #202124" x="5" y="440.649209" transform="rotate(-0 5 440.649209)">Handoff state</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 439.760811)">Source-supported direct function,</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 451.941299)">mechanism analogy, unsupported match or</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(132.559055 465.179404)">unresolved evidence</text>
   </g>
   <g id="text_28">
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 439.705146)">Specify the next technical question;</text>
    <text style="font-size: 9.5px; font-family: 'Arial'; fill: #202124" transform="translate(347.992126 451.996963)">routes remain proposed</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 494.547305)">Note. The main replay uses K=30 and three subsequent grant years. Repeated selection of a patent in different screens</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 506.184414)">remains separate events. Strict C,m comparisons require adequate task, noncore and unfamiliar supply. The shortfall</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 517.821523)">equals actual exchanges only for the specified deterministic selector; it predicts an action, not its value.</text>
   </g>
  </g>
 </g>
