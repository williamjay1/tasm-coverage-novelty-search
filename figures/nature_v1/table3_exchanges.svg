   <g id="text_27">
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 184.547305)">Note. N(9,3) versus B(9), with equal core positions and noncore identifiers. Binding is defined by the unfamiliar shortfall at</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 196.184414)">origin, not by subsequent links. The ratios divide net linked-document gains, after subtracting removed documents, by</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 207.821523)">introduced document events. They are not citation counts or unique inventions. All nonbinding lists remain identical; full</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 219.403789)">all-screen, binding and nonbinding estimates, organization ranges and crossed sensitivities are retained in the</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 231.093633)">supplement.</text>
