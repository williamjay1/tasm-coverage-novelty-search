   <g id="text_20">
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 147.40582)">Note. Means per 30-document list over the same 356 situations. Allocation contrasts compare the coverage match with</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 159.084414)">baseline; within-allocation contrasts compare the novelty reservation with its coverage match. Unfamiliar exposure counts</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 170.721523)">documents with an unseen core combination, not unique combinations. General reach counts documents cited by at least</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 182.358633)">two external organizations. Task-linked event totals are 921/1,418/1,436 under baseline/match/novelty for the primary</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 193.995742)">ranking and 1,050/1,462/1,544 for the alternative. Reproduced shares are 497/515 and 412/494. Each policy supplies</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 205.644102)">10,680 document occurrences. Repeated document selections remain separate events. The matched lists preserve the</text>
    <text style="font-size: 9px; font-family: 'Arial'; fill: #202124" transform="translate(5 217.269961)">novelty lists' core counts and all noncore identifiers.</text>
   </g>
